<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 562" width="1125" height="843" role="img" aria-label="Nike Pegasus 43 Black/White-Volt side profile illustration">
  <defs>
    <radialGradient id="studioSpot" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#f8f8fa" />
      <stop offset="60%" stop-color="#ededf0" />
      <stop offset="100%" stop-color="#e0e0e5" />
    </radialGradient>
    <linearGradient id="floorFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5e5ea" stop-opacity="0" />
      <stop offset="100%" stop-color="#d4d4da" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="upperMain" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#2c2c30" />
      <stop offset="50%" stop-color="#17171a" />
      <stop offset="100%" stop-color="#0b0b0d" />
    </linearGradient>
    <linearGradient id="collarSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38383d" />
      <stop offset="100%" stop-color="#1c1c20" />
    </linearGradient>
    <linearGradient id="reactxFoam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f5f5f7" />
      <stop offset="100%" stop-color="#e4e4e8" />
    </linearGradient>
    <linearGradient id="voltBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9ff26" />
      <stop offset="100%" stop-color="#c3f500" />
    </linearGradient>
    <filter id="shoeShadow" x="-12%" y="-12%" width="124%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Studio backdrop + subtle floor depth -->
  <rect width="750" height="562" fill="url(#studioSpot)" />
  <rect y="365" width="750" height="197" fill="url(#floorFade)" />

  <!-- Contact shadow under sole -->
  <ellipse cx="384" cy="404" rx="255" ry="17" fill="#b8b8c2" opacity="0.52" />
  <ellipse cx="386" cy="401" rx="205" ry="9" fill="#8e8e98" opacity="0.34" />

  <g filter="url(#shoeShadow)">
    <!-- Waffle rubber outsole + toe bumper -->
    <path
      d="M104 322 C114 358 172 380 274 390 C392 400 534 398 634 375 C647 371 649 361 638 354 L116 318 Z"
      fill="#101012"
    />
    <!-- Waffle lug notches -->
    <g fill="#26262b">
      <rect x="242" y="383" width="16" height="4" rx="1.5" transform="rotate(4 242 383)" />
      <rect x="272" y="386" width="16" height="4" rx="1.5" transform="rotate(2 272 386)" />
      <rect x="302" y="388" width="16" height="4" rx="1.5" />
      <rect x="332" y="389" width="16" height="4" rx="1.5" />
      <rect x="362" y="390" width="16" height="4" rx="1.5" />
      <rect x="392" y="389" width="16" height="4" rx="1.5" />
      <rect x="422" y="388" width="16" height="4" rx="1.5" transform="rotate(-2 422 388)" />
    </g>
    <!-- Volt outsole flex pods -->
    <path d="M136 347 L218 367 L214 375 L132 355 Z" fill="url(#voltBlade)" />
    <path d="M474 381 L588 371 L585 380 L472 390 Z" fill="url(#voltBlade)" />

    <!-- Sculpted ReactX midsole with beveled Pegasus heel -->
    <path
      d="M100 314 C96 329 110 346 154 358 C250 385 450 390 628 367 C652 363 662 343 644 322 C618 303 522 308 380 312 C250 316 144 295 100 314 Z"
      fill="url(#reactxFoam)"
      stroke="#d2d2d8"
      stroke-width="1.5"
    />
    <!-- Sculpted midsole bevel & compression grooves -->
    <path
      d="M126 330 C238 359 442 364 624 341"
      fill="none"
      stroke="#e2e2e7"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <path
      d="M466 368 C532 365 590 358 632 347"
      fill="none"
      stroke="#d4d4dc"
      stroke-width="2"
      stroke-linecap="round"
    />
    <!-- Dual Air Zoom capsules -->
    <rect x="172" y="343" width="66" height="8.5" rx="4.25" transform="rotate(8 172 343)" fill="url(#voltBlade)" />
    <rect x="490" y="343" width="90" height="10" rx="5" transform="rotate(-3 490 343)" fill="url(#voltBlade)" />
    <line x1="504" y1="347" x2="566" y2="344" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />

    <!-- Engineered mesh upper -->
    <path
      d="M112 310 C114 282 146 258 206 235 C254 217 294 184 328 158 C342 148 358 150 378 167 C414 198 458 214 506 210 C538 207 566 188 584 174 C600 162 616 169 626 194 C638 227 644 276 638 322 C636 334 622 340 598 344 C456 361 246 355 112 310 Z"
      fill="url(#upperMain)"
    />

    <!-- Tonal midfoot containment saddle & seam -->
    <path
      d="M270 228 C318 222 366 214 422 230 C452 238 470 278 464 328 L290 324 C268 290 264 252 270 228 Z"
      fill="#202025"
      opacity="0.72"
    />
    <path
      d="M272 229 C264 256 268 292 290 324"
      fill="none"
      stroke="#36363d"
      stroke-width="1.5"
    />

    <!-- Heel counter stabilizer -->
    <path
      d="M558 232 C588 232 624 248 638 286 C641 306 639 322 634 329 C604 338 574 342 544 343 C548 298 552 260 558 232 Z"
      fill="#121215"
      opacity="0.88"
    />

    <!-- Padded collar + Achilles notch + Volt pull tab -->
    <path
      d="M332 162 C348 148 364 150 384 166 C418 195 462 211 508 207 C540 204 566 188 584 174 C574 201 546 226 500 230 C442 236 384 212 332 162 Z"
      fill="url(#collarSheen)"
    />
    <path d="M599 170 L626 151 L635 167 L609 185 Z" fill="url(#voltBlade)" />

    <!-- Sculpted tongue & lace cage -->
    <path
      d="M312 177 C292 168 274 173 266 185 C262 193 276 205 298 213 L350 235 L364 210 Z"
      fill="#252529"
    />
    <!-- Volt Flywire eyelets -->
    <g stroke="#c3f500" stroke-width="1.6" opacity="0.8">
      <line x1="334" y1="186" x2="352" y2="238" />
      <line x1="314" y1="200" x2="332" y2="250" />
      <line x1="294" y1="214" x2="312" y2="262" />
      <line x1="274" y1="228" x2="292" y2="274" />
    </g>
    <!-- Crisp white flat racing laces -->
    <g stroke="#ffffff" stroke-width="4.2" stroke-linecap="round">
      <line x1="294" y1="200" x2="334" y2="185" />
      <line x1="272" y1="214" x2="314" y2="199" />
      <line x1="250" y1="229" x2="294" y2="213" />
      <line x1="230" y1="243" x2="274" y2="227" />
    </g>
    <g fill="#ceff00">
      <circle cx="334" cy="185" r="3.4" />
      <circle cx="314" cy="199" r="3.4" />
      <circle cx="294" cy="213" r="3.4" />
      <circle cx="274" cy="227" r="3.4" />
    </g>

    <!-- Layered speed Swoosh-inspired side blade -->
    <path
      d="M276 264 C356 291 466 281 602 225 C516 283 402 316 292 303 C259 299 251 274 276 264 Z"
      fill="#ffffff"
    />
    <path
      d="M292 275 C368 297 470 287 588 237 C508 287 408 312 306 301 C280 298 274 282 292 275 Z"
      fill="url(#voltBlade)"
    />

    <!-- Forefoot breathable engineered mesh micro-perforations -->
    <g fill="#44444d" opacity="0.82">
      <circle cx="174" cy="284" r="2" />
      <circle cx="188" cy="280" r="2" />
      <circle cx="202" cy="276" r="2" />
      <circle cx="216" cy="272" r="2" />
      <circle cx="162" cy="296" r="2" />
      <circle cx="176" cy="292" r="2" />
      <circle cx="190" cy="288" r="2" />
      <circle cx="204" cy="284" r="2" />
      <circle cx="218" cy="280" r="2" />
      <circle cx="174" cy="304" r="2" />
      <circle cx="188" cy="300" r="2" />
      <circle cx="202" cy="296" r="2" />
      <circle cx="216" cy="292" r="2" />
    </g>
  </g>
</svg>
